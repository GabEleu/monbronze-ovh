# monbronze.fr : Nginx devant le serveur Next.js autonome (127.0.0.1:3000).
# Installée par enable-https.sh dans /etc/nginx/sites-available/monbronze.fr.
# - HTTP et www → https://monbronze.fr ;
# - fichiers versionnés de Next (/_next/static) et ressources lourdes (modèles 3D, HDR,
#   vidéos, images, sons) servis directement depuis le disque, avec cache ;
# - le reste (pages, /api/contact, /api/upload) passe au serveur Next.

upstream monbronze_app {
  server 127.0.0.1:3000;
  keepalive 16;
  # Plus court que le délai de Node (5 s) : jamais de connexion fermée sous un POST.
  keepalive_timeout 4s;
}

server {
  listen 80;
  listen [::]:80;
  server_name monbronze.fr www.monbronze.fr;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://monbronze.fr$request_uri;
  }
}

server {
  # Syntaxe compatible Nginx 1.24 (Ubuntu 24.04) ; « http2 on; » n'existe qu'à partir de 1.25.1.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.monbronze.fr;

  ssl_certificate /etc/letsencrypt/live/monbronze.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/monbronze.fr/privkey.pem;
  include /etc/nginx/snippets/monbronze-tls.conf;

  return 301 https://monbronze.fr$request_uri;
}

server {
  # Syntaxe compatible Nginx 1.24 (Ubuntu 24.04) ; « http2 on; » n'existe qu'à partir de 1.25.1.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name monbronze.fr;

  ssl_certificate /etc/letsencrypt/live/monbronze.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/monbronze.fr/privkey.pem;
  include /etc/nginx/snippets/monbronze-tls.conf;
  include /etc/nginx/snippets/monbronze-headers.conf;

  # Seul le formulaire (JSON) arrive ici : les pièces jointes vont directement au stockage.
  client_max_body_size 64k;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain
    application/xml model/gltf+json;

  # Fichiers de Next à nom versionné : cache d'un an.
  location ^~ /_next/static/ {
    alias /srv/monbronze/current/.next/static/;
    include /etc/nginx/snippets/monbronze-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # Ressources lourdes du dossier public/ (noms non versionnés : cache d'une semaine).
  location ~ ^/(models|hdr|atelier|images|audio)/ {
    root /srv/monbronze/current/public;
    include /etc/nginx/snippets/monbronze-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
    try_files $uri =404;
  }

  # Médias envoyés depuis l'espace d'administration (MEDIA_DIR) : noms choisis par le serveur
  # (uuid), jamais réécrits → cache d'un an. Tout autre chemin sous /media : introuvable.
  location /media/ {
    return 404;
  }
  location ~ ^/media/(images|videos|modeles)/[0-9a-f-]{36}\.(webp|mp4|glb)$ {
    root /srv/monbronze/shared;
    types {
      image/webp webp;
      video/mp4 mp4;
      model/gltf-binary glb;
    }
    include /etc/nginx/snippets/monbronze-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # Espace d'administration : envoi de photos, vidéos et modèles 3D (100 Mo au plus), transmis
  # au fil de l'eau ; contenu texte (4 Mo) ; connexion : limite générale (64 ko).
  location = /api/admin/media {
    client_max_body_size 100m;
    proxy_request_buffering off;
    include /etc/nginx/snippets/monbronze-proxy.conf;
    proxy_read_timeout 120s;
  }
  location = /api/admin/content {
    client_max_body_size 4m;
    include /etc/nginx/snippets/monbronze-proxy.conf;
  }

  location / {
    include /etc/nginx/snippets/monbronze-proxy.conf;
    proxy_read_timeout 30s;
  }
}
