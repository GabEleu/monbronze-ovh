# monbronze.fr : configuration de DÉPART (HTTP seulement), installée par setup-vps.sh.
# Elle sert le site en HTTP le temps d'obtenir le certificat (enable-https.sh la remplace
# ensuite par monbronze.fr.conf).

upstream monbronze_app {
  server 127.0.0.1:3000;
  keepalive 16;
  # Plus court que le délai de Node (5 s) : jamais de connexion fermée sous un POST.
  keepalive_timeout 4s;
}

server {
  listen 80;
  listen [::]:80;
  server_name monbronze.fr www.monbronze.fr;

  # Validation Let's Encrypt (certbot --webroot).
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # (L'espace d'administration refuse toute connexion tant que le site n'est pas en HTTPS.)
  location / {
    include /etc/nginx/snippets/monbronze-proxy.conf;
  }
}
